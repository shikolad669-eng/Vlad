</g>
<g font-family="Arial,sans-serif" fill="#000">
<text x="350" y="1104" font-size="15" font-weight="bold">Кейс для гитары — лекало v2</text>
<text x="350" y="1124" font-size="11">Fender California Debut Redondo CE</text>
<text x="350" y="1140" font-size="11">дредноут с вырезом + голова Strat</text>
<text x="350" y="1160" font-size="11">Кейс = контур гитары + ~3 см поролон/стенка</text>
<text x="350" y="1176" font-size="11">Глубина короба 13,5 см (база 8,5 + крышка 5)</text>
<text x="350" y="1192" font-size="11">Стенки: гибкая фанера 3–4 мм | дно/крышка 4–6 мм</text>
<text x="350" y="1212" font-size="10" font-style="italic">Данные из PDF прошлой попытки + лучшие практики.</text>
<text x="350" y="1226" font-size="10" font-style="italic">Форму сверить, приложив гитару перед раскроем.</text>
</g>
